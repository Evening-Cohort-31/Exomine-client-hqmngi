<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Solar System Mining Marketplace</title>
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <h1>Solar System Mining Marketplace</h1>

    <div class="row">
      <div>
        <label for="govSelect">Choose a governor</label>
        <div id="governors"></div>
      </div>

      <div>
        <h2 id="colonyHeader">Colony Minerals</h2>
        <div id="colonyMinerals"></div>
      </div>
    </div>

    <div class="row">
      <div>
        <label for="facilitySelect">Choose a facility</label>
        <div id="facilities"></div>
      </div>
    </div>

    <section class="row">
      <article class="box">
        <h2>Facility Minerals</h2>
        <div id="facilityMinerals"></div>
      </article>

      <article class="box">
        <h2>Space Cart</h2>
        <div id="cart"></div>
        <button id="purchaseBtn">Purchase Mineral</button>
      </article>
    </section>

    <script type="module" src="./scripts/main.js"></script>
  </body>
</html>
